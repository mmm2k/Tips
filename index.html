<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NFL Tipping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F6F3; --card:#FFFFFF; --ink:#12201A; --muted:#56675E; --rule:#D3DDD7;
  --pen:#1E45C9; --pen-soft:#E6ECFC; --tick:#157A3B; --cross:#BF3328;
  --turf:#1C5636; --turf-line:rgba(255,255,255,.16); --chalk:#FFFFFF;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1812; --card:#14231B; --ink:#E6EEE9; --muted:#93A69C; --rule:#27392F;
    --pen:#86A6FF; --pen-soft:#1C2A4D; --tick:#52C27F; --cross:#F2786B;
    --turf:#123B25; --turf-line:rgba(255,255,255,.10); --chalk:#F4F8F5;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1812; --card:#14231B; --ink:#E6EEE9; --muted:#93A69C; --rule:#27392F;
  --pen:#86A6FF; --pen-soft:#1C2A4D; --tick:#52C27F; --cross:#F2786B;
  --turf:#123B25; --turf-line:rgba(255,255,255,.10); --chalk:#F4F8F5;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}

/* Header: the field */
.band{background:var(--turf);color:var(--chalk);
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),var(--turf-line) calc(10% - 2px) 10%);
  padding:28px 0 22px}
.band h1{font:700 clamp(2.6rem,9vw,4.6rem)/.88 var(--display);margin:0;letter-spacing:.005em;overflow-wrap:anywhere}
.who{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.95rem}
.who strong{font-weight:600}
.linkish{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.nickform{display:flex;gap:8px;flex-wrap:wrap}
.nickform input{background:rgba(255,255,255,.95);color:#12201A;border:0;border-radius:6px;padding:6px 10px;min-width:0;width:14rem;max-width:100%}
.nickform button{border:1px solid rgba(255,255,255,.6);background:transparent;color:var(--chalk);border-radius:6px;padding:6px 12px;cursor:pointer}

/* Tabs */
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--rule);margin-top:6px}
.tabs button{background:none;border:0;padding:14px 0 10px;font:600 1.3rem/1 var(--display);color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

main.wrap{padding-top:22px;padding-bottom:64px}
.weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px}
.weeks button{flex:none;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 14px;font:600 1.05rem/1.1 var(--display);cursor:pointer}
.weeks button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.summary{color:var(--muted);margin:0 0 6px}
.summary strong{color:var(--ink);font-weight:600}
.day{font:600 1.15rem/1.2 var(--display);margin:26px 0 8px;color:var(--muted)}

/* Games */
.game{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px;margin-bottom:10px}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:8px}
.vs{align-self:center;color:var(--muted);font-size:.85rem}
.team{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
  background:transparent;border:1px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer;min-width:0}
.team.home{align-items:flex-end;text-align:right}
.team:hover:not(:disabled){background:var(--pen-soft)}
.team:disabled{cursor:default}
.code{font:700 2rem/1 var(--display);letter-spacing:.01em;display:flex;align-items:baseline;gap:10px}
.team.home .code{flex-direction:row-reverse}
.score{font:600 1.5rem/1 var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.name{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.team.picked .code{color:var(--pen)}
.team.won .score{color:var(--ink)}
.team.lost .code{opacity:.55}
.team.picked.lost .code{opacity:1}
.ring{position:absolute;left:-2px;top:-4px;width:calc(100% + 4px);height:calc(100% + 8px);pointer-events:none;overflow:visible}
.ring path{fill:none;stroke:var(--pen);stroke-width:2.4;stroke-linecap:round;vector-effect:non-scaling-stroke}
.ring.fresh path{stroke-dasharray:400;stroke-dashoffset:400;animation:draw .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.mark{font:700 1.1rem/1 var(--body);margin-top:2px}
.mark.ok{color:var(--tick)} .mark.no{color:var(--cross)}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);border-top:1px dashed var(--rule);margin-top:10px;padding-top:8px}
.meta .soon{color:var(--cross);font-weight:600}
details.others{margin-top:6px;font-size:.88rem}
details.others summary{cursor:pointer;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.split h4{margin:0 0 4px;font:600 1rem/1.2 var(--display)}
.split ul{margin:0;padding:0;list-style:none;color:var(--muted)}
.split .home{text-align:right}

/* Ladder */
.ladder{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ladder th{font:600 .95rem/1.2 var(--display);color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--ink)}
.ladder td{padding:12px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
.ladder .num{text-align:right}
.ladder .rank{font:700 1.6rem/1 var(--display);width:3rem}
.ladder .total{font:700 1.6rem/1 var(--display)}
.ladder tr.me td{background:var(--pen-soft)}
.ladder tr.me td:first-child{box-shadow:inset 3px 0 0 var(--pen)}
.tipster{display:flex;align-items:center;gap:10px;min-width:0}
.tipster img{width:28px;height:28px;border-radius:50%;flex:none}
.tipster span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tablewrap{overflow-x:auto}
.foot{color:var(--muted);font-size:.88rem;margin-top:14px;max-width:62ch}

/* Admin */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px;margin-bottom:18px}
.panel h2{font:700 1.5rem/1.1 var(--display);margin:0 0 4px}
.panel p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row + .row{margin-top:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
input.t,select.t{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;color:var(--ink);min-width:0}
input.sc{width:4.2rem;text-align:center;font:600 1.2rem/1 var(--display)}
.res{display:grid;grid-template-columns:auto 4.2rem auto 4.2rem auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.res:last-child{border-bottom:0}
.res .c{font:700 1.3rem/1 var(--display)}
.res .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.quiet{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn:disabled{opacity:.5;cursor:default}
.pill{font-size:.75rem;border-radius:999px;padding:2px 8px;border:1px solid var(--rule);color:var(--muted)}
.pill.final{border-color:var(--tick);color:var(--tick)}

.empty{background:var(--card);border:1px dashed var(--rule);border-radius:12px;padding:22px;color:var(--muted)}
.empty strong{color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 40px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:480px){
  .wrap{padding:0 14px}
  .code{font-size:1.7rem;gap:6px} .score{font-size:1.3rem}
  .team{padding:8px}
  .res{grid-template-columns:auto 3.6rem auto 3.6rem;}
  .res .acts{grid-column:1 / -1;justify-content:flex-start}
  input.sc{width:3.6rem}
}

/* Teams */
.myteams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{position:relative;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.tcard:hover:not(:disabled){border-color:var(--pen)}
.tcard:disabled{cursor:default}
.tcard .code{font-size:2.3rem}
.tcard.picked .code{color:var(--pen)}
.tcard .ring{left:2px;top:2px;width:7rem;height:3.8rem}
.tcard .opp{font-size:.9rem}
.tcard .when{font-size:.82rem;color:var(--muted)}
.tag{font-size:.8rem;font-weight:600;color:var(--pen)}
.pts{position:absolute;right:12px;top:12px;font:700 1.5rem/1 var(--display)}
.pts.ok{color:var(--tick)} .pts.no{color:var(--muted)}
.bye{opacity:.6}
.member{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.member.me{box-shadow:inset 3px 0 0 var(--pen)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mhead strong{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhead .wk{font:700 1.3rem/1 var(--display);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{position:relative;border:1px solid var(--rule);border-radius:8px;padding:4px 10px;font:700 1.15rem/1.1 var(--display);display:flex;gap:6px;align-items:baseline}
.chip small{font:500 .75rem/1 var(--body);color:var(--muted)}
.chip.pick{border-color:var(--pen);color:var(--pen);border-width:2px}
.picklabel{font:700 .65rem/1 var(--body);letter-spacing:.06em;background:var(--pen);color:var(--card);border-radius:4px;padding:3px 5px;align-self:center}
.nopick{margin:8px 0 0;font-size:.82rem;color:var(--muted)}
.chip.won{background:color-mix(in srgb,var(--tick) 14%,transparent)}
.chip.lost{opacity:.6}
.fx{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:.92rem}
.fx .h{text-align:right}
.fx b{font:700 1.15rem/1 var(--display)}
.fx .own{color:var(--muted);font-size:.8rem;display:block}
.fx .mid{color:var(--muted);font-size:.8rem;text-align:center}
.hits{list-style:none;margin:6px 0 0;padding:0}
.hits button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:8px 4px;cursor:pointer}
.hits button:hover{background:var(--pen-soft)}
.roster{padding:10px 0;border-bottom:1px solid var(--rule)}
.roster:last-child{border-bottom:0}
.roster .row{margin-top:6px}
.roster select{width:8.2rem}
h3.sub{font:600 1.2rem/1.2 var(--display);margin:30px 0 6px}
@media (max-width:480px){.tcard .code{font-size:1.9rem}.roster select{width:calc(50% - 6px)}}
/* Login */
.login{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:20px;
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.login-card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.login-card h2{font:700 2rem/1 var(--display);margin:0}
.login-card p{margin:0;color:var(--muted);font-size:.92rem}
.login-card .msg{color:var(--ink);min-height:1.4em}
.login-card input{width:100%}
@media (prefers-reduced-motion:reduce){.ring.fresh path{animation:none;stroke-dashoffset:0}#toast{transition:none}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <h1 id="compName">NFL Tipping</h1>
    <div class="who" id="who"></div>
  </div>
</header>
<nav class="wrap"><div class="tabs" role="tablist" id="tabs"></div></nav>
<main class="wrap" id="main"><div class="empty">Loading the comp…</div></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/supabase-adapter.js"></script>
<script>
const TEAMS={ARI:"Cardinals",ATL:"Falcons",BAL:"Ravens",BUF:"Bills",CAR:"Panthers",CHI:"Bears",CIN:"Bengals",CLE:"Browns",DAL:"Cowboys",DEN:"Broncos",DET:"Lions",GB:"Packers",HOU:"Texans",IND:"Colts",JAC:"Jaguars",KC:"Chiefs",LA:"Rams",LAC:"Chargers",LV:"Raiders",MIA:"Dolphins",MIN:"Vikings",NE:"Patriots",NO:"Saints",NYG:"Giants",NYJ:"Jets",PHI:"Eagles",PIT:"Steelers",SEA:"Seahawks",SF:"49ers",TB:"Buccaneers",TEN:"Titans",WAS:"Commanders"};
const PICK_PTS=4,TEAM_PTS=1;

const S={db:null,user:null,uid:null,admin:false,readOnly:false,noDb:false,
  games:[],tips:{},players:{},profiles:{},settings:{},myDoc:{picks:{}},dirty:false,
  week:null,weekTouched:false,tab:"pick",gamesReady:false,
  editingNick:false,fresh:null,pendingRender:false};

const $=s=>document.querySelector(s);
function h(tag,props,...kids){
  const e=document.createElement(tag);
  if(props)for(const[k,v]of Object.entries(props)){
    if(v==null||v===false)continue;
    if(k==="class")e.className=v;
    else if(k==="text")e.textContent=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;
}
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2800);}

const fmtDay=new Intl.DateTimeFormat(undefined,{weekday:"long",day:"numeric",month:"long"});
const fmtTime=new Intl.DateTimeFormat(undefined,{hour:"numeric",minute:"2-digit"});
const fmtShort=new Intl.DateTimeFormat(undefined,{weekday:"short",hour:"numeric",minute:"2-digit"});
const kickMs=g=>Date.parse(g.kickoff);
const isFinal=g=>g.status==="final";
const isLocked=g=>isFinal(g)||Date.now()>=kickMs(g);
function winner(g){if(!isFinal(g))return null;const hs=+g.homeScore,as=+g.awayScore;return hs>as?g.home:as>hs?g.away:"TIE";}
function until(ms){const m=Math.max(0,Math.round(ms/60000));if(m<60)return m+"m";const hr=Math.floor(m/60);if(hr<24)return hr+"h "+(m%60)+"m";return Math.floor(hr/24)+"d "+(hr%24)+"h";}
function weeks(){return[...new Set(S.games.map(g=>+g.week))].sort((a,b)=>a-b);}
function defaultWeek(){const ws=weeks();if(!ws.length)return null;for(const w of ws)if(S.games.some(g=>+g.week===w&&!isFinal(g)))return w;return ws[ws.length-1];}
const weekGames=w=>S.games.filter(g=>+g.week===w);
const gameOf=(team,w)=>S.games.find(g=>+g.week===w&&(g.home===team||g.away===team));

/* ---------- People ---------- */
function tipsFor(uid){return uid===S.uid?S.myDoc:S.tips[uid];}
function teamsOf(uid){const p=S.players[uid];return(p&&Array.isArray(p.teams))?p.teams:[];}
function displayName(uid){
  const d=tipsFor(uid);
  if(d&&typeof d.nick==="string"&&d.nick.trim())return d.nick.trim();
  const p=S.profiles[uid];
  return(p&&p.name)||(uid===S.uid?"You":"Someone");
}
function members(){return Object.keys(S.players).sort((a,b)=>displayName(a).localeCompare(displayName(b)));}
function ownersOf(team){return members().filter(u=>teamsOf(u).includes(team));}

/* ---------- Picks & scoring ---------- */
const pickKey=w=>"w"+w;
function rawPick(uid,w){const d=tipsFor(uid);return d&&d.picks?d.picks[pickKey(w)]:null;}
function validPick(uid,w){
  const p=rawPick(uid,w);if(!p||!p.t||!p.at)return null;
  if(!teamsOf(uid).includes(p.t))return null;
  const g=gameOf(p.t,w);if(!g)return null;
  return Date.parse(p.at)<kickMs(g)?p.t:null;
}
/* Picks are visible to everyone as soon as they're made */
function visiblePick(uid,w){return validPick(uid,w);}
function teamResult(uid,w,team){
  const g=gameOf(team,w);if(!g||!isFinal(g))return null;
  const won=winner(g)===team;const isPick=validPick(uid,w)===team;
  return{won,pts:won?(isPick?PICK_PTS:TEAM_PTS):0,isPick};
}
function weekScore(uid,w){
  let pts=0,pickWon=false,decided=0;
  for(const t of teamsOf(uid)){const r=teamResult(uid,w,t);if(!r)continue;decided++;pts+=r.pts;if(r.isPick&&r.won)pickWon=true;}
  return{pts,pickWon,decided};
}
function ladder(){
  const finals=S.games.filter(isFinal);
  const lastWeek=finals.length?Math.max(...finals.map(g=>+g.week)):null;
  const ws=[...new Set(finals.map(g=>+g.week))];
  const rows=members().map(uid=>{
    let total=0,pickWins=0,wk=0;
    for(const w of ws){const s=weekScore(uid,w);total+=s.pts;if(s.pickWon)pickWins++;if(w===lastWeek)wk=s.pts;}
    return{uid,total,pickWins,wk};
  });
  rows.sort((a,b)=>b.total-a.total||b.pickWins-a.pickWins||b.wk-a.wk||displayName(a.uid).localeCompare(displayName(b.uid)));
  let rank=0,prev=null;
  rows.forEach((r,i)=>{if(!prev||prev.total!==r.total||prev.pickWins!==r.pickWins||prev.wk!==r.wk)rank=i+1;r.rank=rank;prev=r;});
  return{rows,lastWeek,finals:finals.length};
}

/* ---------- Saving ---------- */
let saveTimer=null,saveChain=Promise.resolve();
function queueSave(msg){S.dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(()=>flush(msg),400);}
function flush(msg){
  saveTimer=null;
  const body=JSON.parse(JSON.stringify(S.myDoc));body.updatedAt=new Date().toISOString();
  saveChain=saveChain.then(()=>S.db.doc("tips/"+S.uid).set(body)).then(()=>{if(!saveTimer)S.dirty=false;toast(msg||"Saved");})
  .catch(e=>{
    if(!saveTimer)S.dirty=false;
    if(e&&e.code==="invalid_argument"){S.readOnly=true;toast("You can view this comp but not pick. Ask the organiser to give you interact access.");}
    else toast("That didn't save. Check your connection and try again.");
    render();
  });
}
function setPick(code){
  if(!S.uid||S.readOnly)return;
  const w=S.week,g=gameOf(code,w);
  if(!g){toast((TEAMS[code]||code)+" have a bye this week.");return;}
  if(isLocked(g)){toast("That game has kicked off, so it can't be your pick now.");render();return;}
  const cur=validPick(S.uid,w);
  if(cur&&cur!==code){const cg=gameOf(cur,w);if(cg&&isLocked(cg)){toast("Your pick has already kicked off. It's locked in for this week.");return;}}
  S.myDoc.picks=S.myDoc.picks||{};
  if(cur===code){delete S.myDoc.picks[pickKey(w)];S.fresh=null;queueSave("Pick cleared");}
  else{S.myDoc.picks[pickKey(w)]={t:code,at:new Date().toISOString()};S.fresh=code+w;queueSave((TEAMS[code]||code)+" are your pick for week "+w);}
  render();
}

/* ---------- Rendering ---------- */
function isField(el){return el&&(el.tagName==="INPUT"||el.tagName==="SELECT"||el.tagName==="TEXTAREA");}
function render(){
  const a=document.activeElement;
  if(S.tab==="admin"&&isField(a)&&$("#main").contains(a)){S.pendingRender=true;return;}
  S.pendingRender=false;
  const nm=S.settings.name||"NFL Tipping";$("#compName").textContent=nm;document.title=nm;
  renderWho();renderTabs();
  const m=$("#main");m.replaceChildren();
  if(S.noDb){m.append(h("div",{class:"empty"},h("strong",{text:"Couldn't connect to the comp's database. "}),"Check the Supabase settings in Vercel, then reload."));return;}
  if(!S.gamesReady){m.append(h("div",{class:"empty",text:"Loading the comp…"}));return;}
  ({pick:renderPick,teams:renderTeams,ladder:renderLadder,admin:renderAdmin})[S.tab](m);
}
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.pendingRender&&!isField(document.activeElement))render();},0));

function renderWho(){
  const w=$("#who");w.replaceChildren();
  if(!S.uid){if(!S.noDb&&S.db)w.append(h("span",{text:"Sign in to claude.ai to make your pick."}));return;}

    const inp=h("input",{type:"text",maxlength:"32","aria-label":"Your name in the comp",value:displayName(S.uid)});
    w.append(h("form",{class:"nickform",onsubmit:e=>{e.preventDefault();S.myDoc.nick=inp.value.trim().slice(0,32);S.editingNick=false;queueSave("Name saved");render();}},
      inp,h("button",{type:"submit",text:"Save name"}),h("button",{type:"button",text:"Cancel",onclick:()=>{S.editingNick=false;render();}})));
    setTimeout(()=>inp.focus(),0);return;
  }
  w.append(h("span",null,"Playing as ",h("strong",{text:displayName(S.uid)})));
  if(!S.readOnly)w.append(h("button",{class:"linkish",text:"Change name",onclick:()=>{S.editingNick=true;render();}}));
  if(window.claude&&window.claude.signOut)w.append(h("button",{class:"linkish",text:"Sign out",onclick:()=>window.claude.signOut()}));

function renderTabs(){
  const t=$("#tabs");t.replaceChildren();
  const tabs=[["pick","My pick"],["teams","Teams"],["ladder","Ladder"]];
  if(S.admin)tabs.push(["admin","Admin"]);
  for(const[k,l]of tabs)t.append(h("button",{role:"tab","aria-selected":String(S.tab===k),text:l,onclick:()=>{S.tab=k;render();}}));

function weekPicker(into){
  const ws=weeks();if(!ws.length)return;
  const box=h("div",{class:"weeks",role:"group","aria-label":"Week"});
  for(const w of ws)box.append(h("button",{"aria-pressed":String(w===S.week),text:"Week "+w,onclick:()=>{S.week=w;S.weekTouched=true;render();}}));
  into.append(box);
}
const RING='<path d="M9,31 C8,13 38,5 63,6 C94,7 114,16 113,31 C112,48 84,56 58,55 C31,54 9,47 10,30 C11,21 21,13 35,10"/>';
function ring(fresh){const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 122 60");s.setAttribute("preserveAspectRatio","none");s.setAttribute("class","ring"+(fresh?" fresh":""));s.setAttribute("aria-hidden","true");s.innerHTML=RING;return s;}
function oppText(team,g){const home=g.home===team;return(home?"vs ":"at ")+(home?g.away:g.home)+" "+(TEAMS[home?g.away:g.home]||"");}

function renderPick(m){
  if(!S.games.length){m.append(h("div",{class:"empty"},h("strong",{text:"No games yet. "}),S.admin?"Add fixtures from the Admin tab.":"The organiser hasn't loaded any fixtures yet."));return;}
  weekPicker(m);
  if(!S.uid){m.append(h("div",{class:"empty",text:"Sign in to claude.ai to see your teams and make your pick."}));return;}
  const mine=teamsOf(S.uid),w=S.week;
  if(!mine.length){m.append(h("div",{class:"empty"},h("strong",{text:"You don't have teams yet. "}),S.admin?"Assign yourself four teams in the Admin tab.":"The organiser will assign your four teams. Check back soon."));return;}
  const pick=validPick(S.uid,w),ws=weekScore(S.uid,w);
  const line=h("p",{class:"summary"});
  if(pick)line.append("Your pick of the round is ",h("strong",{text:(TEAMS[pick]||pick)}),". ");
  else line.append(h("strong",{text:"Choose one of your teams as your pick of the round. "}));
  line.append(`A pick win is ${PICK_PTS} points, any other team win is ${TEAMS_PT()} each.`);
  if(ws.decided)line.append(" ",h("strong",{text:ws.pts+" points"})," this week so far.");
  m.append(line);
  const grid=h("div",{class:"myteams"});
  for(const t of mine){
    const g=gameOf(t,w),picked=pick===t,r=teamResult(S.uid,w,t);
    const pickLocked=pick&&pick!==t&&isLocked(gameOf(pick,w));
    const card=h("button",{type:"button",class:"tcard"+(picked?" picked":"")+(g?"":" bye"),"aria-pressed":String(picked),
      "aria-label":(TEAMS[t]||t)+(picked?", your pick of the round":""),
      disabled:(!g||isLocked(g)||pickLocked||S.readOnly)?true:null,onclick:()=>setPick(t)},
      h("span",{class:"code",text:t}),h("span",{class:"name",text:TEAMS[t]||""}));
    if(g){
      card.append(h("span",{class:"opp",text:oppText(t,g)}));
      let when;
      if(isFinal(g))when=`Final ${g.away} ${g.awayScore}, ${g.home} ${g.homeScore}`;
      else if(isLocked(g))when="Playing now";
      else when=fmtShort.format(new Date(g.kickoff))+", locks in "+until(kickMs(g)-Date.now());
      card.append(h("span",{class:"when",text:when}));
    }else card.append(h("span",{class:"when",text:"Bye this week"}));
    if(picked){card.append(ring(S.fresh===t+w));card.append(h("span",{class:"tag",text:"Pick of the round"}));}
    if(r)card.append(h("span",{class:"pts "+(r.pts?"ok":"no"),text:r.pts?"+"+r.pts:"0"}));
    grid.append(card);
  }
  m.append(grid);
  m.append(h("p",{class:"foot",text:"Tap a team to make it your pick. You can switch any time before your picked team's game kicks off. Once it starts, the pick is locked for the week."}));
}
function TEAMS_PT(){return TEAM_PTS+(TEAM_PTS===1?" point":" points");}

function renderTeams(m){
  weekPicker(m);
  const w=S.week,ids=members();
  if(!ids.length){m.append(h("div",{class:"empty",text:"No one has been given teams yet."}));return;}
  m.append(h("p",{class:"summary",text:"Everyone's four teams and pick of the round for week "+w+"."}));
  for(const uid of ids){
    const vp=visiblePick(uid,w),s=weekScore(uid,w);
    const chips=h("div",{class:"chips"});
    for(const t of teamsOf(uid)){
      const r=teamResult(uid,w,t),g=gameOf(t,w);
      let cls="chip"+(vp===t?" pick":"");
      if(r)cls+=r.won?" won":" lost";
      chips.append(h("span",{class:cls,title:(TEAMS[t]||t)+(g?" "+oppText(t,g):", bye")+(vp===t?", pick of the round":"")},vp===t?h("span",{class:"picklabel",text:"PICK"}):null,t,
        h("small",{text:g?(r?(r.pts?"+"+r.pts:"0"):(g.home===t?"v ":"@ ")+(g.home===t?g.away:g.home)):"bye"})));
    }
    m.append(h("div",{class:"member"+(uid===S.uid?" me":"")},
      h("div",{class:"mhead"},h("strong",{text:displayName(uid)+(uid===S.uid?" (you)":"")}),
        h("span",{class:"wk",text:s.decided?s.pts+" pts":""})),chips,
      vp?null:h("p",{class:"nopick",text:"No pick yet this week"})));
  }
  const games=weekGames(w);
  if(games.length){
    m.append(h("h3",{class:"sub",text:"Week "+w+" games and who has each team"}));
    let lastDay="";
    for(const g of games){
      const day=fmtDay.format(new Date(g.kickoff));
      if(day!==lastDay){m.append(h("p",{class:"summary",text:day}));lastDay=day;}
      const own=t=>{const o=ownersOf(t).map(displayName);return h("span",{class:"own",text:o.length?o.join(", "):"Nobody"});};
      const mid=isFinal(g)?`${g.awayScore} to ${g.homeScore}`:fmtTime.format(new Date(g.kickoff));
      m.append(h("div",{class:"fx"},h("div",null,h("b",{text:g.away})," ",own(g.away)),h("div",{class:"mid",text:mid}),h("div",{class:"h"},h("b",{text:g.home})," ",own(g.home))));
    }
  }
}

function renderLadder(m){
  const{rows,lastWeek,finals}=ladder();
  if(!rows.length){m.append(h("div",{class:"empty",text:"The ladder appears once players have their teams."}));return;}
  const tbl=h("table",{class:"ladder"},
    h("thead",null,h("tr",null,h("th",{text:"#"}),h("th",{text:"Player"}),h("th",{class:"num",text:lastWeek?"Wk "+lastWeek:"Week"}),h("th",{class:"num",text:"Pick wins"}),h("th",{class:"num",text:"Total"}))),
    h("tbody",null,rows.map(r=>{const p=S.profiles[r.uid];
      return h("tr",{class:r.uid===S.uid?"me":null},h("td",{class:"rank",text:r.rank}),
        h("td",null,h("div",{class:"tipster"},p&&p.avatarUrl?h("img",{src:p.avatarUrl,alt:""}):null,h("span",{text:displayName(r.uid)+(r.uid===S.uid?" (you)":"")}))),
        h("td",{class:"num",text:r.wk}),h("td",{class:"num",text:r.pickWins}),h("td",{class:"num total",text:r.total}));})));
  m.append(h("div",{class:"tablewrap"},tbl));
  m.append(h("p",{class:"foot",text:(finals?finals+" game"+(finals===1?"":"s")+" decided so far. ":"No results yet, so everyone's level. ")+
    `Your pick of the round scores ${PICK_PTS} if it wins. Each of your other teams scores ${TEAMS_PT()} per win. Ties and byes score nothing. Level players split on most pick wins, then the latest week.`}));
}

/* ---------- Admin ---------- */
function renderAdmin(m){
  if(window.claude&&window.claude.syncResults){
    const btn=h("button",{class:"btn",type:"button",text:"Sync NFL results now",onclick:async()=>{
      btn.disabled=true;btn.textContent="Syncing…";
      try{const r=await window.claude.syncResults();toast("Updated "+r.updated+" games from weeks "+r.weeks.join(", "));}
      catch(e){toast("Sync didn't work: "+e.message);}
      btn.disabled=false;btn.textContent="Sync NFL results now";
    }});
    m.append(h("div",{class:"panel"},h("h2",{text:"NFL results"}),
      h("p",{text:"Pulls last week's results, this week's scores and next week's fixtures. This also runs automatically once a day."}),btn));
  }
  // Name
  const nameIn=h("input",{class:"t",type:"text",maxlength:"40",value:S.settings.name||"NFL Tipping",style:"flex:1;min-width:12rem","aria-label":"Competition name"});
  m.append(h("div",{class:"panel"},h("h2",{text:"Competition name"}),
    h("form",{class:"row",onsubmit:async e=>{e.preventDefault();try{await S.db.doc("meta/settings").set({name:nameIn.value.trim()||"NFL Tipping"});toast("Name saved");}catch{toast("The name didn't save. Try again.");}}},
      nameIn,h("button",{class:"btn",type:"submit",text:"Save name"}))));

  // Players & teams
  const pp=h("div",{class:"panel"},h("h2",{text:"Players and their teams"}),h("p",{text:"Players appear here once they have signed in. Search for them by name, then give them their four teams."}));
  const hits=h("ul",{class:"hits"});
  const q=h("input",{class:"t",type:"search",placeholder:"Search people who have signed in",style:"width:100%","aria-label":"Search for a player"});
  const runSearch=async()=>{
    if(!S.user)return;
    const res=await S.user.search(q.value);
    hits.replaceChildren(...res.filter(p=>!S.players[p.id]).map(p=>h("li",null,h("button",{type:"button",text:p.name+(p.isMe?" (you)":""),onclick:async()=>{
      try{await S.db.doc("players/"+p.id).set({teams:[]});S.profiles[p.id]=p;toast(p.name+" added");q.value="";hits.replaceChildren();}catch{toast("Couldn't add that player.");}
    }}))));
  };
  q.addEventListener("input",runSearch);q.addEventListener("focus",runSearch);
  pp.append(h("div",{class:"srch"},q,hits));
  const joined=Object.keys(S.tips).filter(u=>!S.players[u]);
  if(joined.length){
    pp.append(h("p",{style:"margin:12px 0 4px",text:"Opened the comp but has no teams yet:"}));
    pp.append(h("div",{class:"chips"},joined.map(u=>h("button",{type:"button",class:"btn quiet",text:"Add "+displayName(u),onclick:async()=>{try{await S.db.doc("players/"+u).set({teams:[]});toast(displayName(u)+" added");}catch{toast("Couldn't add that player.");}}}))));
  }
  const taken=new Set();members().forEach(u=>teamsOf(u).forEach(t=>taken.add(t)));
  for(const uid of members()){
    const cur=teamsOf(uid);
    const sels=[0,1,2,3].map(i=>{const s=h("select",{class:"t","aria-label":displayName(uid)+" team "+(i+1)},h("option",{value:"",text:"None"}),
      Object.keys(TEAMS).map(c=>h("option",{value:c,text:c+" "+TEAMS[c],selected:cur[i]===c?true:null})));return s;});
    pp.append(h("div",{class:"roster"},h("strong",{text:displayName(uid)}),
      h("div",{class:"row"},sels,
        h("button",{class:"btn",type:"button",text:"Save teams",onclick:async()=>{
          const teams=[...new Set(sels.map(s=>s.value).filter(Boolean))];
          try{await S.db.doc("players/"+uid).set({teams});toast(displayName(uid)+"'s teams saved");}catch{toast("Those teams didn't save. Try again.");}
        }}),
        h("button",{class:"btn quiet",type:"button",text:"Remove",onclick:async()=>{
          if(!confirm("Remove "+displayName(uid)+" from the comp? Their picks stay stored but they leave the ladder."))return;
          try{await S.db.doc("players/"+uid).delete();toast("Player removed");}catch{toast("Couldn't remove that player.");}
        }}))));
  }
  const free=Object.keys(TEAMS).filter(t=>!taken.has(t));
  if(members().length)pp.append(h("p",{style:"margin:12px 0 0",text:free.length?"Not assigned to anyone: "+free.join(", "):"Every team is assigned."}));
  m.append(pp);

  // Results
  const rp=h("div",{class:"panel"},h("h2",{text:"Enter results"}),h("p",{text:"Type the final score and choose Save final. Points update for everyone straight away."}));
  weekPicker(rp);
  const games=weekGames(S.week);
  if(!games.length)rp.append(h("p",{text:"No games in this week."}));
  for(const g of games){
    const a=h("input",{class:"t sc",type:"number",min:"0",inputmode:"numeric","aria-label":g.away+" score",value:g.awayScore??""});
    const hm=h("input",{class:"t sc",type:"number",min:"0",inputmode:"numeric","aria-label":g.home+" score",value:g.homeScore??""});
    rp.append(h("div",{class:"res"},h("span",{class:"c",text:g.away}),a,h("span",{class:"c",text:"at "+g.home}),hm,
      h("div",{class:"acts"},
        h("span",{class:"pill"+(isFinal(g)?" final":""),text:isFinal(g)?"Final":fmtShort.format(new Date(g.kickoff))}),
        h("button",{class:"btn",type:"button",text:"Save final",onclick:async()=>{
          if(a.value===""||hm.value===""){toast("Enter both scores first.");return;}
          try{await S.db.doc("games/"+g.id).set({...strip(g),awayScore:+a.value,homeScore:+hm.value,status:"final"});toast(g.away+" v "+g.home+" saved as final");}catch{toast("That result didn't save. Try again.");}}}),
        isFinal(g)?h("button",{class:"btn quiet",type:"button",text:"Reopen",onclick:async()=>{try{await S.db.doc("games/"+g.id).set({...strip(g),status:"scheduled"});toast("Marked as not final");}catch{toast("Couldn't update that game.");}}}):null,
        h("button",{class:"btn quiet",type:"button",text:"Delete",onclick:async()=>{if(!confirm("Delete "+g.away+" at "+g.home+"?"))return;try{await S.db.doc("games/"+g.id).delete();toast("Game deleted");}catch{toast("Couldn't delete that game.");}}}))));
  }
  m.append(rp);

  // Add game
  const opts=()=>Object.entries(TEAMS).map(([c,n])=>h("option",{value:c,text:c+" "+n}));
  const wk=h("input",{class:"t",type:"number",min:"1",max:"22",value:S.week||1,style:"width:5rem"});
  const aw=h("select",{class:"t"},opts()),hs=h("select",{class:"t"},opts());
  const ko=h("input",{class:"t",type:"datetime-local"}),note=h("input",{class:"t",type:"text",maxlength:"30",placeholder:"e.g. London"});
  m.append(h("div",{class:"panel"},h("h2",{text:"Add a game"}),h("p",{text:"Kickoff is in your local time."}),
    h("form",{onsubmit:async e=>{e.preventDefault();
      if(aw.value===hs.value){toast("Pick two different teams.");return;}
      if(!ko.value){toast("Set the kickoff time.");return;}
      const w=+wk.value||1,body={week:w,away:aw.value,home:hs.value,kickoff:new Date(ko.value).toISOString(),status:"scheduled"};
      if(note.value.trim())body.note=note.value.trim();
      try{await S.db.doc("games/w"+w+"-"+aw.value+"-"+hs.value).set(body);toast("Game added");S.week=w;S.weekTouched=true;}catch{toast("Couldn't add that game.");}}},
      h("div",{class:"row"},h("label",{class:"f"},"Week",wk),h("label",{class:"f"},"Away",aw),h("label",{class:"f"},"Home",hs)),
      h("div",{class:"row"},h("label",{class:"f"},"Kickoff",ko),h("label",{class:"f"},"Venue note",note),h("button",{class:"btn",type:"submit",text:"Add game",style:"align-self:flex-end"})))));
}
function strip(g){const{id,...rest}=g;return rest;}

/* ---------- Boot ---------- */
render();
setInterval(()=>{if(S.tab==="admin"||S.editingNick||isField(document.activeElement))return;S.fresh=null;render();},30000);
async function resolveNames(){if(!S.user)return;const ids=[...new Set([...Object.keys(S.players),...Object.keys(S.tips)])];if(S.uid)ids.push(S.uid);if(!ids.length)return;S.profiles=await S.user.profiles(ids);render();}
(async()=>{
  const claude=window.claude;
  if(!claude||typeof claude.use!=="function"){S.noDb=true;render();return;}
  const[db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db){S.noDb=true;render();return;}
  S.db=db;S.user=user;
  if(user){const me=await user.me();S.uid=me.id;S.admin=!!(me.canEdit||me.isOwner);}
  db.collection("games").onSnapshot(snap=>{
    S.games=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(+a.week-+b.week)||kickMs(a)-kickMs(b));
    S.gamesReady=true;if(!S.weekTouched||!weeks().includes(S.week))S.week=defaultWeek();render();
  },()=>{S.gamesReady=true;render();});
  db.collection("tips").onSnapshot(snap=>{
    const t={};for(const d of snap.docs)t[d.id]=d.data();S.tips=t;
    if(S.uid&&!S.dirty){const mine=t[S.uid];S.myDoc=mine?JSON.parse(JSON.stringify(mine)):{picks:{}};if(!S.myDoc.picks)S.myDoc.picks={};}
    render();resolveNames();
  },()=>{});
  db.collection("players").onSnapshot(snap=>{const p={};for(const d of snap.docs)p[d.id]=d.data();S.players=p;render();resolveNames();},()=>{});
  db.doc("meta/settings").onSnapshot(s=>{S.settings=s.exists?s.data():{};render();},()=>{});
  resolveNames();
})();
